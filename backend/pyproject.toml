[project]
name = "paddock-backend"
version = "0.1.0"
description = "Paddock backend: hosting, versioning and collaboration for pages published by AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt[crypto]>=2.9",
    "certifi>=2024.8.30",
    "boto3>=1.35",
    "python-multipart>=0.0.9",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pixeltable-pgserver>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The throwaway test Postgres asks platformdirs for a runtime folder; containers have none.
filterwarnings = ["ignore:XDG_RUNTIME_DIR is not set:Warning"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"app/services/emails.py" = ["E501"]
"tests/test_sharing.py" = ["E501", "E741"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
